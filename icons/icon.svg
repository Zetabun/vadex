<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1b3a86"/>
      <stop offset=".55" stop-color="#0a1440"/>
      <stop offset="1" stop-color="#030616"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fdcff"/>
      <stop offset=".25" stop-color="#2b8cf0"/>
      <stop offset="1" stop-color="#0b2a78"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ee6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bcd0e6"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fb4cc"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#7ff0ff"/>
      <stop offset="1" stop-color="#2a7dff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="70" cy="90" r="3" opacity=".8"/><circle cx="420" cy="70" r="2.5" opacity=".7"/><circle cx="455" cy="190" r="2" opacity=".6"/>
    <circle cx="120" cy="210" r="2" opacity=".6"/><circle cx="385" cy="130" r="3.5" opacity=".9"/><circle cx="60" cy="300" r="2.5" opacity=".5"/>
    <circle cx="200" cy="60" r="2" opacity=".6"/><circle cx="330" cy="40" r="2" opacity=".5"/><circle cx="460" cy="320" r="2.5" opacity=".5"/>
  </g>
  <!-- invader formation -->
  <g fill="#ffc857" opacity=".95">
    <path d="M150 118l14 10 14-10-4 18h-20z"/><path d="M226 104l14 10 14-10-4 18h-20z"/><path d="M302 104l14 10 14-10-4 18h-20z"/><path d="M378 118l14 10 14-10-4 18h-20z"/>
  </g>
  <!-- planet horizon -->
  <ellipse cx="256" cy="690" rx="470" ry="300" fill="url(#planet)"/>
  <ellipse cx="256" cy="690" rx="470" ry="300" fill="none" stroke="#bff4ff" stroke-width="6" opacity=".7"/>
  <!-- orbit ring -->
  <ellipse cx="256" cy="300" rx="215" ry="62" fill="none" stroke="#5ee6ff" stroke-width="5" opacity=".35" transform="rotate(-12 256 300)"/>
  <!-- ship -->
  <circle cx="256" cy="300" r="170" fill="url(#glow)"/>
  <path d="M232 408h16l-8 70zM264 408h16l-8 70z" fill="url(#flame)"/>
  <path d="M256 238l112 96-18 34-94-44-94 44-18-34z" fill="#5ee6ff" stroke="#051024" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 150c24 36 36 82 36 136v74l-36 42-36-42v-74c0-54 12-100 36-136z" fill="url(#hull)" stroke="#051024" stroke-width="10" stroke-linejoin="round"/>
  <path d="M256 206c10 14 14 32 14 50h-28c0-18 4-36 14-50z" fill="#5ee6ff" stroke="#051024" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 318h48v14h-48z" fill="#ffc857" stroke="#051024" stroke-width="5"/>
  <!-- bolts -->
  <path d="M256 128v-50" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M256 128v-50" stroke="#5ee6ff" stroke-width="20" stroke-linecap="round" opacity=".3"/>
</svg>
