<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Last Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>/* Orbital defence instrument console. Amber = readouts, cyan = friendly/energy, magenta-red = hostile. */
:root{--bg:#050918;--panel:#0a1030;--panel2:#0f1840;--panel3:#162257;--line:#25327a;--line2:#3a4aa0;--amber:#ffb547;--amber2:#ffd58a;--cyan:#5ee6ff;--red:#ff4d7a;--green:#6dff8e;--violet:#b69cff;--text:#e3e9ff;--dim:#8d9acb;--mute:#5c6899;
  --disp:"Chakra Petch","Barlow Semi Condensed",system-ui,sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;--cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ch:9px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-drag:none}

html,body{margin:0;height:100%;background:#02040c;color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}

button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,textarea,select,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text;-webkit-user-drag:auto}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 80px #000}
#gl,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#overlay{pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}
#scan.off{display:none}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,40,90,.55);opacity:0;transition:opacity .5s}
#vig.on{opacity:1;transition:none}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60}
.cham{clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}

/* ---------- top HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 6px) 8px 0;pointer-events:none;z-index:10;background:linear-gradient(180deg,rgba(3,6,20,.92),rgba(3,6,20,.55) 70%,transparent)}
#hud>*{pointer-events:auto}
.hud-row{display:flex;align-items:center;gap:6px}
.wavebox{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.wave-n{font:700 22px/1 var(--disp);color:var(--amber);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.wave-n small{font:600 10px var(--cond);color:var(--dim);letter-spacing:.14em;margin-right:4px;text-transform:uppercase}
.sector{font:600 11px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave-tag{font:700 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:#07102a;background:var(--amber);padding:1px 6px;display:none}
.wave-tag.on{display:inline-block}.wave-tag.boss{background:var(--red);color:#fff}.wave-tag.elite{background:var(--violet)}.wave-tag.resource{background:#ffd700}
.levelbox{flex:0 0 auto;min-width:56px;height:34px;padding:4px 7px 5px;border:1px solid rgba(94,230,255,.34);background:rgba(10,16,48,.82);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:3px;color:var(--cyan)}
.levelbox>b{font:700 10px/1 var(--disp);letter-spacing:.08em;text-align:center}.xp-bar{display:block;width:100%;height:3px;background:rgba(255,255,255,.09);overflow:hidden}.xp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 7px rgba(94,230,255,.55);transition:width .18s}
.hbtn{height:34px;min-width:38px;padding:0 9px;font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;gap:5px}
.hbtn.hold{border-color:var(--amber);color:var(--amber)}.hbtn.push{border-color:var(--cyan);color:var(--cyan)}
.hbtn.badge{border-color:var(--amber);color:#07102a;background:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
.sec-prog{height:3px;background:rgba(255,255,255,.08);margin:5px 0 4px;position:relative}
.sec-prog i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.sec-prog b{position:absolute;top:-2px;width:2px;height:7px;background:var(--amber)}
.curs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;touch-action:pan-x}
.curs::-webkit-scrollbar{display:none}
.cur{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;background:rgba(10,16,48,.82);border:1px solid var(--line);font:600 13px var(--disp);font-variant-numeric:tabular-nums}
.cur i{font-style:normal;font-size:12px}.cur small{font:500 9px var(--cond);color:var(--dim);margin-left:2px}
.cur.bump{animation:bump .25s}@keyframes bump{40%{transform:translateY(-2px);filter:brightness(1.6)}}
#bossbar{margin-top:6px;display:none}
#bossbar.on{display:block}
.boss-name{display:flex;justify-content:space-between;font:700 12px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:#ffd0dc}
.boss-name span:last-child{color:var(--dim);font:600 10px var(--cond);letter-spacing:.12em}
.boss-hp{height:10px;background:rgba(40,6,20,.85);border:1px solid #7a2340;position:relative;margin-top:2px}
.boss-hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff2d6a,#ff7a9f);transition:width .15s}
.boss-hp b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.boss-hp.weak i{background:linear-gradient(90deg,var(--amber),#fff2c4)}
.boss-note{font:600 10px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);height:12px;margin-top:2px}

/* ---------- banners & toasts ---------- */
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:9;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
#banner.on{opacity:1;transform:none}
#banner h2{margin:0;font:700 28px/1.05 var(--disp);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 22px currentColor}
#banner p{margin:6px 24px 0;font:500 13px var(--body);color:var(--text);text-shadow:0 1px 6px #000}
#banner .k{font:700 10px var(--cond);letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
#toasts{position:absolute;left:8px;right:8px;top:calc(var(--st) + 104px);z-index:30;display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:center}
.toast{max-width:100%;padding:7px 12px;font:500 13px/1.25 var(--body);background:rgba(8,13,40,.95);border-left:3px solid var(--cyan);animation:tin .25s;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
.toast.unlock{border-color:var(--amber);color:var(--amber2)}.toast.good{border-color:var(--green)}.toast.warn{border-color:var(--red)}.toast.epic{border-color:var(--violet);color:#e6dcff}.toast.ach{border-color:#ffd700;color:#ffe9a0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#hint{position:absolute;left:0;right:0;bottom:38%;text-align:center;font:600 13px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px #000;pointer-events:none;z-index:8;opacity:0;transition:opacity .5s}
#hint.on{opacity:.95;animation:pulse 1.6s infinite}

/* ---------- bottom cluster ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;flex-direction:column;pointer-events:none}
#bottom>*{pointer-events:auto}
#status{display:flex;gap:8px;padding:0 8px 4px;align-items:flex-end;pointer-events:none}
.bars{flex:1;display:flex;flex-direction:column;gap:2px}
.bar{height:7px;background:rgba(4,8,24,.8);border:1px solid rgba(255,255,255,.12);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .12s}
.bar.hull i{background:linear-gradient(90deg,#3dffb5,#9dffda)}.bar.hull.low i{background:var(--red)}
.bar.shield{height:5px}.bar.shield i{background:var(--cyan)}
.bar.energy{height:5px}.bar.energy i{background:var(--amber)}
.bar label{position:absolute;right:3px;top:-12px;font:600 9px var(--cond);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.combo{font:700 15px var(--disp);color:var(--amber);min-width:64px;text-align:right;text-shadow:0 0 8px rgba(0,0,0,.9);line-height:1}
.combo small{display:block;font:600 9px var(--cond);color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.meters{font:600 10px var(--cond);color:var(--dim);letter-spacing:.06em;text-align:right;white-space:nowrap}
.meters b{color:var(--text);font-family:var(--disp)}
#abil{display:flex;gap:6px;padding:0 8px 6px;justify-content:center}
.ab{position:relative;width:54px;height:54px;background:rgba(10,16,48,.9);border:1.5px solid var(--line2);font-size:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ab i{font-style:normal;position:relative;z-index:2}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(2,4,14,.82);z-index:1}
.ab .t{position:absolute;right:3px;bottom:1px;font:700 10px var(--disp);z-index:3;color:var(--text)}
.ab .ch{position:absolute;left:3px;top:1px;font:700 10px var(--disp);z-index:3;color:var(--amber)}
.ab .au{position:absolute;right:3px;top:1px;font:700 8px var(--cond);letter-spacing:.08em;z-index:3;color:var(--cyan)}
.ab.ready{border-color:currentColor;box-shadow:0 0 12px -2px currentColor}.ab.live{animation:pulse .5s infinite}
.ab:active{transform:scale(.94)}
/* Tactical management mode: give shopping enough room to be usable while preserving a live combat viewport. */
#tactical-time{position:absolute;left:50%;top:0;z-index:4;transform:translate(-50%,-100%) translateY(-7px);padding:4px 9px;border:1px solid rgba(94,230,255,.48);background:rgba(4,10,28,.92);box-shadow:0 0 18px rgba(94,230,255,.13);font:700 9px var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .18s}
#tactical-time b{font:700 10px var(--disp);color:#d8faff}
#tactical-time.on{opacity:1;transform:translate(-50%,-100%) translateY(-5px)}
#bottom.management #abil,#bottom.management .supply-quick{display:none}
#bottom.management #status{padding:0 8px 3px;gap:0;background:linear-gradient(180deg,transparent,rgba(4,7,26,.88))}
#bottom.management #status .meters,#bottom.management #status .combo{display:none}
#bottom.management #status .bars{gap:1px}
#bottom.management #status .bar{height:4px}
#bottom.management #status .bar.shield,#bottom.management #status .bar.energy{height:3px}
#app.management-open #objective{display:none}
/* Between-wave Command Phase: the player explicitly paused a safe intermission to prepare.
   Give management almost the whole usable viewport; live tactical management remains split-view. */
#app.command-phase #objective{display:none}
#app.command-phase #wave-intermission{display:none}
#bottom.command-phase #status,#bottom.command-phase #abil,#bottom.command-phase .supply-quick{display:none}
#bottom.command-phase #tactical-time{display:none}
#bottom.command-phase #panel{background:linear-gradient(180deg,rgba(11,18,49,.995),rgba(5,9,29,.998));border-top-color:rgba(255,181,71,.58);box-shadow:0 -18px 44px rgba(0,0,0,.42)}
#command-phase-bar{display:none;align-items:center;gap:10px;padding:9px 10px 8px;border-bottom:1px solid rgba(255,181,71,.28);background:linear-gradient(90deg,rgba(255,181,71,.11),rgba(94,230,255,.05));flex:0 0 auto}
#command-phase-bar.on{display:flex}
.command-copy{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.command-k{font:700 9px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.command-copy>b{font:700 15px var(--disp);letter-spacing:.05em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.command-copy>small{font:500 10.5px/1.25 var(--body);color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.command-actions{display:flex;gap:6px;flex:0 0 auto}.command-actions .btn{min-height:36px;padding:0 10px}
#bottom.command-phase .p-head{padding-top:7px}
#bottom.command-phase .p-body{padding-bottom:14px}
#panel{background:linear-gradient(180deg,rgba(10,16,48,.97),rgba(6,10,32,.985));border-top:1px solid var(--line2);height:0;overflow:hidden;transition:height .22s ease-out;display:flex;flex-direction:column;position:relative}
#panel.open{height:var(--management-panel-height,min(56vh,calc(100vh - 210px)))}
#panel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.7}
.p-head{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;flex:0 0 auto}
.p-head h3{margin:0;flex:1;font:700 15px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.p-head .x{width:40px;height:32px;font-size:18px;color:var(--dim);border:1px solid var(--line)}
.p-body{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 8px 10px;-webkit-overflow-scrolling:touch}
.p-body::-webkit-scrollbar{width:4px}.p-body::-webkit-scrollbar-thumb{background:var(--line2)}
#nav{display:flex;background:#04071a;border-top:1px solid var(--line);padding-bottom:var(--sb)}
.nb{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);position:relative;border-right:1px solid rgba(255,255,255,.04)}
.nb i{font-style:normal;font-size:19px;line-height:1;color:var(--text);opacity:.85}
.nb.on{color:var(--amber);background:linear-gradient(180deg,rgba(255,181,71,.16),transparent)}.nb.on i{color:var(--amber);opacity:1}
.nb.on::before{content:"";position:absolute;left:20%;right:20%;top:0;height:2px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.nb .pip{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;background:var(--amber);border-radius:50%;box-shadow:0 0 8px var(--amber);display:none}
.nb.new .pip,.nb.can .pip{display:block}.nb.can .pip{background:var(--green);box-shadow:0 0 8px var(--green)}
.nb.hide{display:none}
.nb.reveal{animation:reveal 1s}@keyframes reveal{0%{background:var(--amber);color:#000}100%{}}

/* ---------- shared panel widgets ---------- */
.tabs{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap}
.tab{flex:1 1 auto;min-height:36px;padding:0 10px;font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--panel2);border:1px solid var(--line);position:relative}
.tab.on{color:#07102a;background:var(--amber);border-color:var(--amber)}
.tab .pip{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--green);display:none}.tab.can .pip{display:block}
.mults{display:flex;gap:3px;margin-left:auto}
.mult{min-width:40px;height:32px;padding:0 6px;font:700 11px var(--disp);color:var(--dim);border:1px solid var(--line);background:var(--panel)}
.mult.on{color:var(--cyan);border-color:var(--cyan);background:rgba(94,230,255,.1)}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 10px 8px;margin-bottom:6px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative}
.card.can{border-color:#4a5cc0}.card.maxed{opacity:.62}.card.locked{opacity:.5}
.card.flash{animation:cflash .45s}@keyframes cflash{0%{background:rgba(255,181,71,.5)}}
.c-name{font:600 14px var(--body);display:flex;align-items:center;gap:6px;min-width:0}
.c-name b{font:700 11px var(--disp);color:var(--amber);background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);padding:0 5px;white-space:nowrap}
.c-desc{font:400 12px/1.3 var(--body);color:var(--dim);grid-column:1}
.c-val{font:600 12px var(--disp);color:var(--text);grid-column:1;font-variant-numeric:tabular-nums}
.c-val em{font-style:normal;color:var(--green)}.c-val .arrow{color:var(--mute);margin:0 4px}
.c-ms{grid-column:1/-1;margin-top:5px}
.gauge{height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 1px,transparent 1px 10%),rgba(0,0,0,.4);position:relative;border:1px solid rgba(255,255,255,.08)}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c9861f,var(--amber))}
.ms-note{font:500 11px var(--cond);color:var(--amber2);margin-top:3px;letter-spacing:.02em}
.ms-note b{color:var(--amber);font-family:var(--disp)}
.buy{grid-row:1/span 3;grid-column:2;min-width:92px;min-height:52px;padding:4px 8px;background:var(--panel3);border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px var(--disp);color:var(--mute);font-variant-numeric:tabular-nums}
.buy small{font:600 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:inherit;opacity:.85}
.buy.can{background:linear-gradient(180deg,#ffc15e,#e89a25);border-color:#ffdf9e;color:#1a0f00;box-shadow:0 0 14px -4px var(--amber)}
.buy.can.cy{background:linear-gradient(180deg,#8ff0ff,#35c4e6);border-color:#d0f8ff;box-shadow:0 0 14px -4px var(--cyan)}
.buy.can.vi{background:linear-gradient(180deg,#d2c2ff,#9a7af0);border-color:#eee6ff;box-shadow:0 0 14px -4px var(--violet)}
.buy:active{transform:scale(.96)}
.btn{min-height:40px;padding:0 14px;font:700 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);background:var(--panel3);color:var(--text)}
.btn.pri{background:linear-gradient(180deg,#ffc15e,#e89a25);border-color:#ffdf9e;color:#1a0f00}
.btn.danger{border-color:#9a2346;color:#ff9db6;background:#2a0a18}
.btn.sm{min-height:32px;padding:0 9px;font-size:11px}.btn:disabled{opacity:.4}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sec-h{font:700 11px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font:400 12px/1.4 var(--body);color:var(--dim);margin:4px 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.05);font:500 13px var(--body)}
.kv b{font:600 13px var(--disp);color:var(--amber2);font-variant-numeric:tabular-nums;text-align:right}
.statlink{color:var(--cyan);text-decoration:underline dotted;text-underline-offset:3px}
.pill{display:inline-block;font:700 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor}
.evo{display:flex;gap:3px;margin-top:5px;grid-column:1/-1}
.evo span{flex:1;height:5px;background:rgba(255,255,255,.1)}.evo span.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.slot{min-height:64px;padding:6px;border:1px dashed var(--line2);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--body);text-align:center}
.slot.full{border-style:solid}.slot small{font:600 9px var(--cond);color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.slot i{font-style:normal;font-size:20px}.slot.sel{border-color:var(--amber);box-shadow:0 0 10px -2px var(--amber)}
.mod{display:grid;grid-template-columns:34px 1fr auto;gap:2px 8px;padding:8px;margin-bottom:5px;border:1px solid var(--line);border-left-width:3px;background:var(--panel)}
.mod .ic{grid-row:1/span 2;font-size:20px;display:flex;align-items:center;justify-content:center}
.mod .nm{font:600 13px var(--body)}.mod .ln{font:400 11.5px/1.35 var(--body);color:var(--dim);grid-column:2/-1}

/* ---------- debug ---------- */

@media (min-width:561px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Orbital Foundry: stable controls while the live cycle meter updates. */

.inter-actions{display:flex;gap:7px;justify-content:center;margin-top:5px}.inter-actions .btn{flex:1;max-width:180px}

@media(max-height:620px){#wave-intermission{top:35%;padding:8px 10px}.inter-actions .btn{min-height:34px}#wave-intermission>small{font-size:10px}}

@media(max-height:620px){#command-phase-bar{padding:6px 8px}.command-copy>small{display:none}.command-actions .btn{min-height:32px;padding:0 8px}.command-copy>b{font-size:13px}}

/* v1.7 manual smelting */
.smelter-viz{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 10px;padding:13px;border:1px solid rgba(185,139,104,.26);border-radius:10px;background:linear-gradient(180deg,rgba(185,139,104,.08),rgba(5,10,28,.32));font:700 22px var(--head);overflow:hidden}
.smelter-viz .sm-arrow{color:var(--dim);font-size:18px}.smelter-viz .sm-fire{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,181,71,.28);background:rgba(255,181,71,.07);color:var(--amber2);transition:.2s}
.smelter-viz .sm-ore{color:#b98b68}.smelter-viz .sm-bar{color:#d8e0ea}
.smelter-viz.running .sm-fire{animation:smeltPulse .8s ease-in-out infinite alternate;box-shadow:0 0 22px rgba(255,138,52,.28)}
.smelter-viz.running .sm-ore{animation:oreFeed 1.2s ease-in-out infinite}.smelter-viz.ready .sm-bar{animation:barReady .75s ease-in-out infinite alternate;color:#fff}
@keyframes smeltPulse{to{transform:scale(1.08);background:rgba(255,120,45,.18);box-shadow:0 0 32px rgba(255,122,45,.5)}}
@keyframes oreFeed{50%{transform:translateX(7px) rotate(8deg);filter:brightness(1.25)}}

/* v1.8 material ladder */
.mat-resource-icon,.mat-inline-icon{--mat:#aaa;display:inline-block!important;width:15px;height:9px;min-width:15px;border:1px solid color-mix(in srgb,var(--mat) 72%,#fff);background:linear-gradient(160deg,color-mix(in srgb,var(--mat) 55%,#fff) 0 22%,var(--mat) 23% 68%,color-mix(in srgb,var(--mat) 62%,#000) 69% 100%);clip-path:polygon(14% 0,86% 0,100% 34%,86% 100%,14% 100%,0 34%);box-shadow:0 0 6px color-mix(in srgb,var(--mat) 42%,transparent)}
.mat-inline-icon.ore{clip-path:polygon(18% 0,74% 7%,100% 38%,82% 91%,30% 100%,0 62%,7% 21%);transform:rotate(-5deg)}
.mat-inline-icon.bar{width:18px;min-width:18px;height:9px}.mat-cur small{margin-left:3px;color:var(--dim);font-size:8px}.mat-cur{border-bottom-color:color-mix(in srgb,var(--mat,#fff) 55%,var(--line))}
.material-recipes{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.material-recipes::-webkit-scrollbar{display:none}.mat-recipe{flex:0 0 auto;display:grid;grid-template-columns:auto auto;align-items:center;gap:3px 6px;min-width:82px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#0d1725;color:var(--dim);font:700 10px var(--cond);text-align:left}.mat-recipe small{grid-column:2;font-size:8px;color:var(--dim)}.mat-recipe.on{border-color:var(--amber);color:var(--text);background:#18202c}.mat-selected{border-left:3px solid var(--mat,var(--amber))}.mat-selected .c-name{display:flex;align-items:center;gap:8px}.buy .mat-inline-icon{margin-right:5px}.smelter-viz .mat-inline-icon{width:24px;min-width:24px;height:14px}.smelter-viz .sm-ore,.smelter-viz .sm-bar{display:grid;place-items:center;color:inherit}

/* v1.9 button/UI polish -----------------------------------------------------
   One tactile control language across panels. Amber = commit/primary,
   cyan = selected/active, red = destructive, green = affordable/ready. */
:root{
  --ctl-radius:7px;
  --ctl-border:#33427c;
  --ctl-border-hi:#5063aa;
  --ctl-top:rgba(255,255,255,.07);
  --ctl-shadow:0 1px 0 rgba(255,255,255,.055) inset,0 -1px 0 rgba(0,0,0,.32) inset,0 3px 8px rgba(0,0,0,.22);
  --ctl-shadow-press:0 1px 0 rgba(255,255,255,.035) inset,0 1px 3px rgba(0,0,0,.28);
}

/* Shared tactile motion. Keep this deliberately small so rapid shopping still feels fast. */
.btn,.buy,.tab,.mult,.hbtn,.choice,.mbtn,.slot,.node,.tog,.mat-recipe,.supply-quick,.p-head .x{
  border-radius:var(--ctl-radius);
  transition:transform .08s ease,filter .12s ease,border-color .14s ease,background-color .14s ease,box-shadow .14s ease,color .14s ease,opacity .14s ease;
}
.btn,.tab,.mult,.hbtn,.choice,.mbtn,.slot,.node,.mat-recipe,.supply-quick,.p-head .x{
  box-shadow:var(--ctl-shadow);
}
@media(hover:hover){
  .btn:not(:disabled):hover,.buy:not(:disabled):hover,.tab:hover,.mult:hover,.hbtn:hover,.choice:hover,.mbtn:hover,.slot:hover,.node:not(.locked):hover,.mat-recipe:hover,.supply-quick:hover,.p-head .x:hover{
    filter:brightness(1.11);
    border-color:var(--ctl-border-hi);
  }
}
.btn:not(:disabled):active,.buy:not(:disabled):active,.tab:active,.mult:active,.hbtn:active,.choice:active,.mbtn:active,.slot:active,.node:not(.locked):active,.mat-recipe:active,.supply-quick:active,.p-head .x:active{
  transform:translateY(2px) scale(.99);
  box-shadow:var(--ctl-shadow-press);
  filter:brightness(.97);
}
button:disabled{filter:saturate(.55);opacity:.42;box-shadow:none!important;transform:none!important}

/* General secondary / utility controls. */
.btn{
  min-height:42px;
  border-color:var(--ctl-border);
  background:linear-gradient(180deg,#1b285e 0%,#111a45 56%,#0d1538 100%);

/* Menu cards and selectable slots. */
.mbtn,.slot,.choice,.mat-recipe{
