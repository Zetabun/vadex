<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Last Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=23">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=23" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<title>Last Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Last Orbit v2 — glass-over-space interface. Gold = salvage and rewards, cyan = your ship, green = experience, red = hostile. */
:root{
  --bg:#040716;--ink:#e8eeff;--dim:#98a4cf;--mute:#5f6a96;
  --panel:rgba(11,17,46,.8);--panel2:rgba(18,26,66,.86);--solid:#0b1233;--line:rgba(140,170,255,.16);--line2:rgba(140,170,255,.32);
  --cyan:#5ee6ff;--gold:#ffc857;--amber:#ffb547;--green:#6dffc8;--red:#ff4d7a;--violet:#b69cff;--pink:#ff5fa2;
  --disp:"Chakra Petch","Barlow Semi Condensed",system-ui,sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;--cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--r:14px;
}
/* touch-action on every element: iOS only honours it up to the nearest scroll container, so body alone does not stop double-tap zoom in panels */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#010209;color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 50% 30%,#0a1030,#010209 70%)}
html.standalone,html.standalone body{background:#040716}
/* iOS home-screen apps: 100% heights stop one status-bar short of the screen, while 100vh spans all of it. */
@media (display-mode: standalone){html,body{height:100vh;min-height:100vh}#app{bottom:auto;height:100vh}}
.display-info{margin-top:4px;text-align:center;font:500 11px var(--body);color:var(--mute)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select{-webkit-user-select:auto;user-select:auto}
h1,h2,h3,p{margin:0}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 120px rgba(0,0,0,.9)}
@media (min-width:561px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#gl,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}#overlay{pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.35}
#scan.off{display:none}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,40,90,.5);opacity:0;transition:opacity .5s;z-index:8}
#vig.on{opacity:1;transition:none}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:60}
.ui-icon{display:inline-flex;width:20px;height:20px;flex:none}.ui-icon svg{width:100%;height:100%}
.kicker{font:700 10.5px var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.gold{color:var(--gold)}.muted{color:var(--mute)}

/* ---------- shared controls ---------- */
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--dim);flex:none;transition:background .15s,color .15s}
.icon-btn:hover{color:var(--ink);background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:700 15px var(--disp);font-variant-numeric:tabular-nums}
.chip.salvage{color:#ffe6a6;border-color:rgba(255,200,87,.3)}.chip.big{height:38px;font-size:17px;padding:0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font:700 14px var(--disp);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);background:var(--panel2);transition:transform .1s,filter .15s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#7df0ff,#2ab8d8);color:#03141c;border:0;box-shadow:0 6px 24px rgba(94,230,255,.28)}
.btn.gold{background:linear-gradient(180deg,#ffe08f,#f0a93a);color:#261400;border:0;box-shadow:0 6px 24px rgba(255,200,87,.25)}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.danger{border-color:rgba(255,77,122,.5);color:#ff9fb6;background:rgba(255,77,122,.08)}
.btn.small{min-height:38px;font-size:12px}
.btn:disabled{opacity:.45;filter:saturate(.3)}
.meter{position:relative;height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.meter>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;transition:width .15s}
.meter.small{height:5px;margin-top:8px}.meter.small>i{background:linear-gradient(90deg,var(--gold),#ffe6a6)}
.tog{width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.1);position:relative;border:1px solid var(--line)}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:.2s}
.tog.on{background:rgba(94,230,255,.3)}.tog.on i{left:21px;background:var(--cyan)}
input[type=range]{width:150px;accent-color:var(--cyan)}
select{background:var(--solid);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font:500 14px var(--body)}

/* ---------- mode switching ---------- */
#app[data-mode="hangar"] .hud-layer{display:none}
#app[data-mode="sortie"] #hangar{display:none}

/* ---------- sortie HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 10px 10px;z-index:10;background:linear-gradient(180deg,rgba(3,5,18,.94) 0%,rgba(3,5,18,.7) 70%,transparent);pointer-events:none}
#hud>*{pointer-events:none}#hud .icon-btn{pointer-events:auto}
.hud-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.wave-block{min-width:0}
.sector-name{font:700 10.5px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wave-line{display:flex;align-items:center;gap:8px;margin-top:2px}
.wave-line small{font:700 10px var(--cond);letter-spacing:.2em;color:var(--mute)}
.wave-line b{font:700 20px/1 var(--disp);color:var(--ink);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px;align-items:center;flex:1;max-width:190px}
.pip{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.pip.elite,.pip.mini{background:rgba(182,156,255,.25)}.pip.resource{background:rgba(255,200,87,.22)}.pip.boss{flex:1.8;background:rgba(255,77,122,.28)}
.pip.done{background:var(--cyan)}.pip.boss.done{background:var(--red)}
.pip.now{background:#fff;box-shadow:0 0 8px #fff;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.xp-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.lv{display:flex;align-items:baseline;gap:3px;min-width:44px}
.lv small{font:700 9px var(--cond);letter-spacing:.2em;color:var(--green)}.lv b{font:700 17px/1 var(--disp);color:var(--green)}
.meter.xp{flex:1;height:7px}.meter.xp>i{background:linear-gradient(90deg,#2fd9a5,var(--green));box-shadow:0 0 10px rgba(109,255,200,.6)}
.bossbar{margin-top:9px;padding:6px 10px 8px;border-radius:10px;background:rgba(40,6,20,.7);border:1px solid rgba(255,77,122,.35)}
.boss-label{display:flex;align-items:center;gap:6px;font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:#ffb3c6;margin-bottom:5px}.boss-label .ui-icon{width:14px;height:14px}
.meter.boss{height:9px}.meter.boss>i{background:linear-gradient(90deg,#ff2d6a,#ff8aa8)}
.bossbar.enraged{animation:enrage .5s infinite alternate}@keyframes enrage{to{border-color:#ff4d7a;box-shadow:0 0 18px rgba(255,77,122,.5)}}
#dock{position:absolute;left:0;right:0;bottom:0;padding:18px 10px calc(var(--sb) + 10px);z-index:10;background:linear-gradient(0deg,rgba(3,5,18,.95) 0%,rgba(3,5,18,.72) 70%,transparent);pointer-events:none}
#dock>*{pointer-events:none}#dock .abil{pointer-events:auto}
.loadout{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;min-height:36px;align-items:flex-end}
.gun,.relic-mini{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 5px 3px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--c,#b69cff) 45%,transparent)}
.relic-mini{--c:#b69cff;padding:4px}
.gun-icon{width:28px;height:28px}
.rank{display:flex;gap:1.5px}.rank i{width:3px;height:3px;border-radius:1px;background:rgba(255,255,255,.18)}.rank i.on{background:var(--c)}
.dock-row{display:flex;align-items:center;gap:12px}
.bars{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.bar-row{display:grid;grid-template-columns:52px 1fr 38px;align-items:center;gap:8px}
.bar-row .lbl{font:700 10px var(--cond);letter-spacing:.2em;color:var(--mute)}
.bar-row .val{font:700 12px var(--disp);text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.meter.hull{height:10px}.meter.hull>i{background:linear-gradient(90deg,#1fd18b,#7dffc0)}
.meter.hull.low>i{background:linear-gradient(90deg,#ff2d6a,#ff8a5c);animation:pulse .4s infinite alternate}
.meter.shield>i{background:linear-gradient(90deg,#3a7bff,#8fd2ff)}
.shield-row.off{display:none}
.abilities{display:flex;gap:10px}
.abil{position:relative;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.12),rgba(8,12,34,.9));border:2px solid color-mix(in srgb,var(--c) 40%,transparent);transition:transform .1s}
.abil .abil-icon{width:34px;height:34px;opacity:.45;filter:grayscale(.8)}
.abil .cd{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(transparent var(--p,360deg),rgba(2,4,14,.7) 0);pointer-events:none}
.abil.ready{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.abil.ready .abil-icon{opacity:1;filter:none}
.abil.active{animation:abilOn .35s infinite alternate}@keyframes abilOn{to{box-shadow:0 0 30px var(--c)}}
.abil:active{transform:scale(.93)}
.abil .charges{position:absolute;right:-2px;top:-2px;font:700 11px var(--disp);color:var(--ink)}
.abil .key{position:absolute;bottom:-4px;right:-2px;font:700 9px var(--disp);color:var(--mute);background:var(--solid);border-radius:5px;padding:0 4px}
@media (hover:none){.abil .key{display:none}}
.fly-hint{position:absolute;left:50%;bottom:40%;transform:translate(-50%,10px);z-index:9;text-align:center;padding:10px 16px;border-radius:12px;background:rgba(4,8,26,.78);border:1px solid var(--line2);opacity:0;transition:.4s;pointer-events:none;width:max-content;max-width:86%}
.fly-hint.on{opacity:1;transform:translate(-50%,0)}
.fly-hint b{display:block;font:700 16px var(--disp);letter-spacing:.06em;color:var(--cyan);text-transform:uppercase}
.fly-hint span{font:500 13px var(--body);color:var(--dim)}

/* ---------- banners & toasts ---------- */
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;z-index:9;opacity:0;transform:scale(.96);transition:opacity .3s,transform .3s}
#banner.on{opacity:1;transform:none}
#banner h2{font:700 30px/1.05 var(--disp);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 26px currentColor,0 2px 0 #000}
#banner p{margin:8px 28px 0;font:500 14px var(--body);color:var(--ink);text-shadow:0 1px 8px #000}
#banner .k{font:700 11px var(--cond);letter-spacing:.32em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
#toasts{position:absolute;left:12px;right:12px;top:calc(var(--st) + 112px);z-index:35;display:flex;flex-direction:column;align-items:stretch;gap:6px;pointer-events:none}
#app[data-mode="hangar"] #toasts{top:calc(var(--st) + 70px)}
.toast{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:10px 14px;border-radius:14px;font:600 14px/1.3 var(--body);background:rgba(10,16,44,.99);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.55);animation:tin .28s cubic-bezier(.2,.8,.3,1.2)}
.toast-text{flex:1;min-width:0;overflow-wrap:anywhere}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast.out{opacity:0;transform:translateY(-6px);transition:.3s}
.toast.unlock{border-color:rgba(255,200,87,.6)}.toast.good{border-color:rgba(109,255,200,.5)}.toast.warn{border-color:rgba(255,77,122,.6)}
.notice{padding:8px 12px 8px 8px;background:linear-gradient(100deg,rgba(40,30,8,.97),rgba(10,16,44,.97) 55%)}
.notice-art{width:44px;height:44px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,200,87,.35)}
.notice-ico{width:32px;height:32px}
.notice-main{flex:1;min-width:0;display:flex;flex-direction:column}
.notice-main small{font:700 10px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.notice-main b{font:700 16px/1.15 var(--disp);letter-spacing:.03em}
.notice-main span{font:600 12.5px var(--body);color:var(--dim);overflow-wrap:anywhere}
.notice-reward{flex:none;display:flex;align-items:center;font:700 16px var(--disp);color:var(--gold)}

/* ---------- artwork (see modules/ui/art.js) ---------- */
.art{display:inline-flex;flex:none}.art svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 2.5px color-mix(in srgb,var(--ic-a) 55%,transparent))}
.art .a{fill:var(--ic-a)}.art .b{fill:var(--ic-b)}.art .c{fill:#0b1330}.art .w{fill:#fff}.art .f{fill:#ffcf5e}.art .r{fill:#ff4d7a}
.art .a,.art .b,.art .c,.art .w,.art .f,.art .r{stroke:#040816;stroke-width:2.5;stroke-linejoin:round;paint-order:stroke}
.art .s,.art .t,.art .k{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}
.art .s{stroke:var(--ic-a)}.art .t{stroke:var(--ic-b)}.art .k{stroke:#fff;stroke-width:2.5}.art .g{opacity:.3}
.cur-ico{width:1.05em;height:1.05em;margin-right:4px;vertical-align:-.16em}
.cur-ico svg{filter:none}
.boss-ico{width:16px;height:16px}
.ship-icon{width:52px;height:52px}

/* ---------- hangar ---------- */
#hangar{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column}
.hg-top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(3,5,18,.9),rgba(3,5,18,.4) 80%,transparent)}
.brand{flex:1;display:flex;flex-direction:column;line-height:1}
.brand b{white-space:nowrap;font:700 22px var(--disp);letter-spacing:.16em;color:var(--ink);text-shadow:0 0 22px rgba(94,230,255,.45)}
.brand small{font:700 9.5px var(--cond);letter-spacing:.34em;color:var(--cyan);text-transform:uppercase;margin-top:4px}
/* Scrolling panes show no scroll bar (on a phone it sat over the right edge of every panel): the edge with more beyond
   it fades out instead, so the last panel in view trails off (.more-b, .more-t: ui/dom.js scrollHints). */
.hg-body,.modal,.track,.warp-chips{scrollbar-width:none}.hg-body::-webkit-scrollbar,.modal::-webkit-scrollbar,.track::-webkit-scrollbar,.warp-chips::-webkit-scrollbar{display:none}
.hg-body.more-b,.modal.more-b{-webkit-mask-image:linear-gradient(#000 calc(100% - 64px),transparent);mask-image:linear-gradient(#000 calc(100% - 64px),transparent)}
.hg-body.more-t,.modal.more-t{-webkit-mask-image:linear-gradient(transparent,#000 28px);mask-image:linear-gradient(transparent,#000 28px)}
.hg-body.more-t.more-b,.modal.more-t.more-b{-webkit-mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 64px),transparent)}
.hg-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#hangar:not([data-tab="launch"]) .hg-body{background:linear-gradient(180deg,rgba(4,7,22,.55),rgba(4,7,22,.94) 90px);backdrop-filter:blur(3px)}
.hg-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(var(--sb) + 8px);background:rgba(4,7,22,.96);border-top:1px solid var(--line)}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:12px;color:var(--mute);font:700 10.5px var(--cond);letter-spacing:.1em;text-transform:uppercase;transition:color .15s,background .15s}
.nav-btn .ui-icon{width:22px;height:22px}
.nav-btn.on{color:var(--ink);background:rgba(94,230,255,.1)}.nav-btn.on .ui-icon{color:var(--cyan)}
.nav-btn .badge{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);display:none}
.nav-btn.badged .badge{display:block}
.launch{min-height:100%;display:flex;flex-direction:column;padding:0 12px 12px;gap:10px}
.ship-stage{flex:1;min-height:34vh}
.launch-card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(8px)}
.ship-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.ship-head h1{font:700 30px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.link{white-space:nowrap;display:inline-flex;align-items:center;gap:2px;font:700 12px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}.link .ui-icon{width:16px;height:16px}
.lede{margin-top:10px;font:500 15px/1.45 var(--body);color:var(--dim)}
.stat-row,.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{padding:10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.stat small{display:block;font:700 9.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;margin-top:3px;font:700 16px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.launch-dock{position:sticky;bottom:0;margin:0 -12px -12px;padding:14px 12px 12px;background:linear-gradient(180deg,transparent,rgba(4,7,22,.92) 35%)}
.launch-btn{width:100%;min-height:68px;border-radius:14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:12px;padding:10px 18px;text-align:left;background:linear-gradient(180deg,#ffe08f,#f0a032);color:#241200;box-shadow:0 10px 34px rgba(255,190,80,.32),inset 0 1px 0 rgba(255,255,255,.6);animation:glow 2.4s ease-in-out infinite}
.launch-btn .ui-icon{grid-row:1/3;width:30px;height:30px}
.launch-btn span{font:700 21px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
.launch-btn small{font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.launch-btn:active{transform:scale(.98)}
@keyframes glow{50%{box-shadow:0 10px 44px rgba(255,190,80,.55),inset 0 1px 0 rgba(255,255,255,.6)}}
.history{display:flex;flex-direction:column;gap:6px}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font:500 13px var(--body);color:var(--dim)}.hist b{font:700 14px var(--disp);color:var(--ink)}
.screen{padding:16px 12px 24px}
.screen-head{margin-bottom:14px}
.screen-head h2{font:700 26px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.screen-head p{margin-top:4px;font:500 14px/1.4 var(--body);color:var(--dim)}

.score-row small{font:700 10px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.score-row b{font:700 22px var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}.score-row span{font:600 12px var(--body);color:var(--dim)}

/* legendary banners: their own box, a slowly turning gradient rim, a glow in each banner's accent colour */
@property --lga{syntax:'<angle>';inherits:false;initial-value:0deg}

.toast.legendary{border:1.5px solid transparent;background:linear-gradient(100deg,rgba(40,24,8,.97),rgba(24,10,44,.97)) padding-box,conic-gradient(from var(--lga),#ffd166,#ff5fa2,#c77dff,#5ee6ff,#ffd166) border-box;animation:legendSpin 4s linear infinite}
.toast.legendary .notice-main small{background:linear-gradient(90deg,#ffd166,#ff5fa2,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent}

.ca-go{min-height:40px;width:48px;padding:0}.ca-stage>.ui-icon{width:18px;height:18px;color:var(--mute)}
.stars-row{display:flex;justify-content:center;gap:10px}
.star-big{font-size:44px;line-height:1;color:rgba(255,255,255,.14)}.star-big.on{color:var(--gold);text-shadow:0 0 18px rgba(255,200,87,.7)}
.star-big.new{animation:starPop .5s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}

.star-notes{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:4px}.star-notes small{font:500 12px var(--body);color:var(--dim)}
.cores-row{color:#a9f3ff}

.oh-panel{margin-bottom:12px;border-color:rgba(255,159,67,.35);background:linear-gradient(160deg,rgba(60,30,8,.55),rgba(12,14,32,.9))}.oh-panel.ready{box-shadow:0 0 0 1px rgba(255,159,67,.5),0 0 24px rgba(255,159,67,.18)}
.oh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.oh-head h3{margin:2px 0 0;font:700 19px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:#ffc58f}
.oh-rank{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border-radius:12px;border:1px solid rgba(255,159,67,.45);background:rgba(255,159,67,.08)}.oh-rank b{font:800 22px var(--disp);color:#ffb070;line-height:1}.oh-rank small{font:600 9.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.oh-panel p{margin:8px 0;font:500 13px var(--body);color:var(--dim)}.oh-meter{display:flex;flex-direction:column;gap:4px}.oh-meter .meter i{background:linear-gradient(90deg,#ff9f43,#ffd08a)}.oh-meter small{font:600 11px var(--body);color:var(--dim)}
.oh-perks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.oh-perks span{padding:3px 8px;border-radius:99px;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.25);font:600 11px var(--body);color:#ffd2a8}.oh-go{width:100%;margin-top:10px}
.oh-confirm{gap:10px}.oh-confirm .modal-head p{font-size:13.5px;line-height:1.4}
.oh-get,.oh-keep{padding:10px 12px;border-radius:14px;background:rgba(10,14,34,.85);border:1px solid var(--line)}.oh-get{border-color:rgba(255,159,67,.42);background:linear-gradient(160deg,rgba(62,32,10,.6),rgba(10,14,34,.9))}
.oh-get .oh-sub,.oh-keep .oh-sub{margin:0 0 4px}.oh-keep .oh-sub{color:var(--cyan)}
.oh-item{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:center;padding:7px 0}.oh-item+.oh-item{border-top:1px solid rgba(255,255,255,.06)}
.oh-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--c,#ffc58f);background:color-mix(in srgb,var(--c,#ff9f43) 13%,transparent);border:1px solid color-mix(in srgb,var(--c,#ff9f43) 42%,transparent)}
.oh-ic .ui-icon{width:22px;height:22px}.oh-ic .bp-ico{width:15px;height:18px;margin:0}.oh-ic .swatch{width:20px;height:20px}.oh-rk{font:800 18px var(--disp);color:#ffb070}
.oh-txt{display:flex;flex-direction:column;gap:2px;min-width:0}.oh-txt b{font:700 15px/1.15 var(--disp);letter-spacing:.02em;color:#ffe9cf}.oh-txt small{font:500 12.5px/1.3 var(--body);color:var(--dim)}
.oh-tags{display:flex;flex-wrap:wrap;gap:5px}.oh-tags span{padding:3px 9px;border-radius:99px;background:rgba(94,230,255,.07);border:1px solid rgba(94,230,255,.24);font:600 11.5px var(--body);color:#c4efff}
.bp-h span{color:#ffc58f}.bp-sub{margin:10px 2px 6px;font:700 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.bp-row{border-color:rgba(255,159,67,.22)}.buy.bp{background:linear-gradient(135deg,#8a4a12,#d9822b)}
.bp-ico{display:inline-block;width:11px;height:13px;margin-right:4px;vertical-align:-1px;border:1.6px solid #ffe2c2;border-radius:2px;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,226,194,.6) 3px 4px)}
.escorts{padding:10px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,159,67,.3);margin-bottom:6px}.esc-head{display:flex;justify-content:space-between;align-items:baseline}.esc-head b{font:700 13px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#ffc58f}.esc-head span{font:600 11px var(--body);color:var(--dim)}
.esc-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.esc{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(10,14,34,.8);color:var(--dim);font:700 12px var(--disp);letter-spacing:.04em}.esc i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:.5}.esc.on{color:var(--ink);border-color:var(--c);box-shadow:0 0 0 1px var(--c)}.esc.on i{opacity:1}
.trail-sw{border-color:rgba(255,255,255,.5)}
.tech-h{display:flex;justify-content:space-between;align-items:baseline}.tech-h span{font:700 12px var(--disp);color:#a9f3ff;letter-spacing:.06em;text-transform:none}
.tech-row{border-color:rgba(94,230,255,.25)}.buy.tech{background:linear-gradient(135deg,#1f6b86,#2fb3d6)}

/* Locked content: one matte grey look everywhere, instead of fading it out. */
:root{--lock-bg:linear-gradient(160deg,#1d2232,#151925);--lock-line:rgba(160,172,198,.18);--lock-ink:#838ca2}
.paint.locked,.threat.locked,.ca-stage.locked,.ship-best.locked,.item.locked{opacity:1;background:var(--lock-bg);border-color:var(--lock-line);box-shadow:none}
.paint.locked,.paint.locked span,.threat.locked,.threat.locked *,.ca-stage.locked b,.ca-stage.locked small,.ship-best.locked,.item.locked{color:var(--lock-ink)}
.paint.locked .swatch,.banner-pick.locked .banner-thumb,.legend-row.locked .legend-thumb{filter:grayscale(1) brightness(.8);opacity:.55}
.ca-stage.locked .ca-num b,.ca-stage.locked .ui-icon{color:var(--lock-ink)}.ca-stage.locked .ca-stars i{color:#3a4152}
.ship.locked{opacity:1;background:var(--lock-bg);border-color:var(--lock-line);box-shadow:none}.ship.locked h3,.ship.locked p,.ship.locked li{color:var(--lock-ink)}
.legend-row.locked,.legendary.locked{opacity:1;background:var(--lock-bg) padding-box,linear-gradient(135deg,rgba(160,172,198,.28),rgba(160,172,198,.1)) border-box}
.item.locked{border-left-color:#4a5268}
/* Picker tiles: labels wrap inside the tile rather than spilling out of it. */
.paint span{min-width:0;overflow-wrap:anywhere;line-height:1.15;text-align:left}

/* Dodge chip: fills as the dash recharges and glows when it is ready. */
.dash-chip{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(8,14,36,.85);border:1px solid var(--line2);color:var(--dim);transition:color .2s,box-shadow .2s}
.dash-chip .cd{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--cyan) var(--p,360deg),rgba(94,230,255,.12) 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
.dash-glyph{font:800 20px/1 var(--disp);margin-top:-2px}
.dash-chip.ready{color:var(--cyan);box-shadow:0 0 12px rgba(94,230,255,.45)}

/* Next rank reward: a tag in the reward's colours, showing your ship in the paint it unlocks. */
.reward-tag{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 6px;border-radius:14px;flex:none;background:linear-gradient(135deg,color-mix(in srgb,var(--rt,#ffc857) 24%,rgba(10,14,34,.7)),rgba(10,14,34,.75));border:1px solid color-mix(in srgb,var(--rt,#ffc857) 60%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--rt,#ffc857) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
.reward-tag .rt-ship{width:30px;height:30px}.reward-tag .rt-ico .art{width:24px;height:24px}.reward-tag .rt-ico{display:grid;place-items:center;width:30px;height:30px}
.rt-text{display:flex;flex-direction:column;line-height:1.1}.rt-text small{font:700 9px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--rt,#ffc857) 70%,#fff)}.rt-text b{font:700 13.5px var(--disp);color:#fff;white-space:nowrap}
.reward-tag.salvage{--rt:#ffc857}

/* Hangar menus that have not opened yet, and ones that just have. */
.nav-btn{position:relative}.nav-lock,.nav-new{display:none}
.nav-btn.locked{opacity:.55;filter:grayscale(1)}.nav-btn.locked .nav-lock{display:grid;place-items:center;position:absolute;top:4px;right:calc(50% - 22px);width:16px;height:16px;border-radius:50%;background:#1d2232;border:1px solid var(--lock-line,rgba(160,172,198,.2));color:#98a1b5}.nav-btn.locked .nav-lock .ui-icon{width:10px;height:10px}
.nav-btn.fresh .nav-new{display:block;position:absolute;top:2px;right:calc(50% - 30px);padding:1px 5px;border-radius:6px;background:var(--gold);color:#1a1300;font:800 8.5px var(--disp);letter-spacing:.08em;box-shadow:0 0 10px rgba(255,200,87,.6)}
.menu-intro{text-align:center;align-items:center}.mi-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto;color:var(--cyan);background:rgba(94,230,255,.1);border:1px solid rgba(94,230,255,.4);box-shadow:0 0 22px rgba(94,230,255,.25)}.mi-icon .ui-icon{width:34px;height:34px}
.room-offer .ro-where{margin-top:10px;font:600 12.5px/1.4 var(--body);color:#ffd98a}

/* Deep Void anomaly pick: violet, a little unsettling. */
.anomaly-pick .modal-head h2{color:#d9a8ff;text-shadow:0 0 28px rgba(199,125,255,.55)}
.anomaly-pick .modal-head .kicker{color:#ff8fc4}
.card.anomaly{border-color:rgba(199,125,255,.45);background:linear-gradient(160deg,rgba(64,20,96,.55),rgba(20,8,40,.75))}
.card.anomaly .rar{color:#ffd166}

/* Callsign: the registration prompt, and the name on the pilot card. */
.callsign{text-align:center;align-items:center}.callsign .mi-icon .art{width:44px;height:44px}
.callsign-input{width:100%;margin:4px 0 2px;padding:12px 14px;border-radius:12px;background:rgba(8,14,36,.85);border:1px solid rgba(94,230,255,.45);color:var(--ink);font:700 18px var(--disp);letter-spacing:.06em;text-align:center;outline:none;box-shadow:inset 0 0 0 1px rgba(94,230,255,.08)}
.callsign-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(94,230,255,.18)}
.callsign-input::placeholder{color:var(--dim);font-weight:600;letter-spacing:.04em}
.callsign .btn[disabled]{opacity:.45;pointer-events:none}
.rank-who{display:flex;flex-direction:column;min-width:0;line-height:1.1}.rank-who small{font:700 9.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:#b69cff}
.rank-who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callsign-edit{display:inline-flex;align-items:center;gap:4px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callsign-edit.nudge{border-color:rgba(255,200,87,.55);color:#ffd99a}
.backup .bk-card{margin-top:2px}.bk-actions{display:flex;gap:8px}.bk-actions .btn{flex:1}
.bk-note{margin:0;min-height:1em;font:600 13px/1.35 var(--body);color:#6dffc8}.bk-err{margin:0;min-height:0;font:600 13px/1.35 var(--body);color:#ff8a9a}.bk-err:empty,.bk-note:empty{display:none}
.bk-h{margin:6px 0 0;font:800 13px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.bk-code,.bk-input{width:100%;box-sizing:border-box;resize:none;padding:10px 12px;border-radius:12px;background:rgba(4,8,20,.8);border:1px solid var(--line2);color:#e8f1ff;font:500 12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all}
.bk-input::placeholder{color:var(--mute);font-family:var(--body)}

/* Counterattack checkpoint resume button (stage 6). */
.ca-cp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 9px;min-width:0;line-height:1.05;margin-right:6px;border-color:rgba(255,200,87,.45);color:var(--gold)}
.ca-cp small{font:700 8px var(--cond);letter-spacing:.14em;text-transform:uppercase;opacity:.8}.ca-cp b{font:800 11.5px var(--disp);letter-spacing:.06em}
.cp-note{display:block;margin-top:6px;color:var(--dim);font:600 11.5px var(--body);text-align:center}

/* Header, top left: the pilot's callsign and rank. */
.brand.pilot-id{flex:1;min-width:0;flex-direction:row;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.brand-ins{flex:none;width:34px;height:34px;display:grid;place-items:center}.brand-ins .rank-ins{width:34px;height:34px}
.brand-txt{display:flex;flex-direction:column;min-width:0;line-height:1}
.brand.pilot-id b{overflow:hidden;text-overflow:ellipsis;font-size:20px;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 0 12px rgba(94,230,255,.35);padding:8px 10px 8px 0;margin:-8px -10px -8px 0}
.brand.pilot-id small{letter-spacing:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.brand.pilot-id b{font-size:17px;letter-spacing:.08em}.brand-ins,.brand-ins .rank-ins{width:28px;height:28px}}

/* Overhaul panel v2.8: the station blueprint, what the Overhaul pays, and the roadmap. */
.oh-plan{position:relative;margin:10px 0 8px;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,rgba(28,70,120,.55),rgba(6,14,34,.95));border:1px solid rgba(94,230,255,.28);box-shadow:inset 0 0 30px rgba(94,230,255,.08)}
.oh-plan svg{display:block;width:100%;height:auto;aspect-ratio:4/3}
.oh-plan .sb-gridline{stroke:rgba(94,230,255,.07);stroke-width:.05}.oh-plan .sb-gridmajor{stroke:rgba(94,230,255,.16);stroke-width:.08}
.oh-plan .sb-axis{stroke:rgba(94,230,255,.22);stroke-width:.08;stroke-dasharray:.8 .6;fill:none}.oh-plan .sb-ticks{stroke:rgba(159,233,255,.45);stroke-width:.1;fill:none}.oh-plan .sb-corner{stroke:rgba(159,233,255,.7);stroke-width:.2;fill:none}
.oh-plan .sb-title rect{fill:rgba(6,14,34,.75);stroke:rgba(159,233,255,.55);stroke-width:.12}.oh-plan .sb-title path{stroke:rgba(159,233,255,.35);stroke-width:.08}.oh-plan .sb-title text{fill:#bfefff;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;letter-spacing:.08em}
.oh-plan .sb-fine{stroke-width:.1;opacity:.7}
.oh-plan g{fill:none;stroke-width:.16;stroke-linejoin:round;stroke-linecap:round}
.oh-plan .sb-core{stroke:#9fe9ff;fill:rgba(94,230,255,.1)}
.oh-plan .sb-next{stroke:#ffc857;stroke-dasharray:.5 .4;fill:rgba(255,200,87,.06);animation:sbPulse 2.2s ease-in-out infinite}
.oh-plan .sb-mod.ghost{stroke:rgba(159,233,255,.35);stroke-dasharray:.35 .35}
.oh-plan .sb-mod.built{stroke:#9fe9ff;fill:rgba(94,230,255,.18)}
.oh-plan .sb-mod.lit{stroke:#e8fbff;fill:rgba(94,230,255,.42);filter:drop-shadow(0 0 .5px #5ee6ff)}
@keyframes sbPulse{50%{opacity:.45}}
.oh-plan-tag{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;line-height:1.1}.oh-plan-tag small{font:700 9px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:rgba(159,233,255,.7)}.oh-plan-tag b{font:700 14px var(--disp);letter-spacing:.06em;color:#e8fbff}
.oh-plan-next{position:absolute;left:10px;right:10px;bottom:7px;display:flex;align-items:center;gap:6px;font:600 11px var(--body);color:#ffd99a}.oh-plan-next i{width:14px;height:0;border-top:2px dashed #ffc857}
.oh-pay{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,159,67,.12);border:1px solid rgba(255,159,67,.4)}
.oh-pay div{display:flex;flex-direction:column;line-height:1.1}.oh-pay small{font:700 9.5px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:#ffc58f}.oh-pay b{font:800 20px var(--disp);color:#ffe3bf}.oh-pay>span{font:600 11px var(--body);color:var(--dim);text-align:right}
.oh-sub{margin:12px 0 6px;font:700 10.5px var(--cond);letter-spacing:.22em;text-transform:uppercase;color:#ffc58f}
.rm-list{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}.rm-list::-webkit-scrollbar{display:none}
.rm-card{flex:0 0 138px;scroll-snap-align:start;display:flex;flex-direction:column;gap:3px;padding:8px 10px 9px;border-radius:12px;background:rgba(12,16,34,.8);border:1px solid var(--line)}
.rm-thumb{height:46px;margin:2px 0 4px;border-radius:8px;background:radial-gradient(90% 90% at 50% 50%,rgba(28,70,120,.45),rgba(6,14,34,.6));border:1px solid rgba(94,230,255,.14)}.rm-thumb svg{display:block;width:100%;height:100%}
.rm-thumb .th-base{fill:none;stroke:rgba(159,233,255,.28);stroke-width:.35}.rm-thumb .th-piece{fill:rgba(255,200,87,.22);stroke:#ffc857;stroke-width:.45;stroke-linejoin:round}.rm-card.done .th-piece{fill:rgba(109,255,200,.2);stroke:#6dffc8}.rm-card.later .th-piece{stroke:#8a96b0;fill:rgba(138,150,176,.12)}
.rm-card.done{border-color:rgba(109,255,200,.3);background:rgba(20,48,44,.55)}.rm-card.next{border-color:rgba(255,200,87,.7);background:linear-gradient(160deg,rgba(80,52,10,.6),rgba(18,16,30,.9));box-shadow:0 0 16px rgba(255,200,87,.2)}.rm-card.later{opacity:.72}
.rm-top{display:flex;justify-content:space-between;align-items:center}.rm-top small{font:700 9px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.rm-tick{font-style:normal;color:#6dffc8;font-weight:800}.rm-next{padding:1px 6px;border-radius:6px;background:var(--gold);color:#1a1300;font:800 8.5px var(--disp);letter-spacing:.08em}
.rm-piece{font:700 13.5px var(--disp);color:var(--ink);letter-spacing:.02em}.rm-desc{font:500 10.5px/1.3 var(--body);color:var(--dim);min-height:27px}
.rm-trail{display:flex;align-items:center;gap:6px;margin-top:4px;font:600 10.5px var(--body);color:#ffd99a}
.rm-room{display:flex;align-items:center;gap:5px;margin-top:4px;font:700 10.5px var(--body);color:var(--c)}.rm-room .ui-icon{width:13px;height:13px}.rm-trail .swatch{width:14px;height:14px;border-radius:50%;flex:none}

/* Command Deck: the pilot's room aboard the station. */
.deck h3 .h-count{margin-left:8px;font:600 11px var(--body);letter-spacing:0;color:var(--dim);text-transform:none}
.deck-window{position:relative;height:170px;border-radius:18px;overflow:hidden;border:3px solid #2b3550;box-shadow:inset 0 0 0 2px #0b0f1e,0 10px 30px rgba(0,0,0,.4);
  background:radial-gradient(1.2px 1.2px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#cfe,transparent),radial-gradient(1.4px 1.4px at 70% 18%,#fff,transparent),radial-gradient(1px 1px at 85% 45%,#dff,transparent),radial-gradient(1px 1px at 55% 35%,#fff,transparent),linear-gradient(#02040e,#081634)}
.dw-earth{position:absolute;left:-30%;right:-30%;top:58%;height:220%;border-radius:50%;background:radial-gradient(60% 40% at 40% 10%,#3f9be0 0,#1f6fb8 30%,#12488a 55%,#0a2a58 80%);box-shadow:0 -6px 24px rgba(90,168,255,.6),inset 0 10px 18px rgba(170,220,255,.55)}

.deck-window.night .dw-earth{background:radial-gradient(60% 40% at 40% 10%,#0d1c38 0,#081228 50%,#050a18 80%);box-shadow:0 -4px 18px rgba(60,100,200,.45),inset 0 8px 14px rgba(60,100,200,.25)}
.deck-window.night .dw-earth::before{background:radial-gradient(1.5px 1.5px at 28% 7%,#ffd27a,transparent),radial-gradient(2px 2px at 33% 9%,#ffc45a,transparent),radial-gradient(1.5px 1.5px at 52% 5%,#ffd27a,transparent),radial-gradient(1.5px 1.5px at 61% 8%,#ffb347,transparent),radial-gradient(2px 2px at 70% 11%,#ffd27a,transparent),radial-gradient(1.5px 1.5px at 44% 12%,#ffc45a,transparent),radial-gradient(8% 3% at 32% 8%,rgba(255,190,90,.35),transparent 70%),radial-gradient(8% 3% at 66% 10%,rgba(255,190,90,.3),transparent 70%)}
.dw-struts{position:absolute;inset:0;background:linear-gradient(90deg,transparent 32.5%,#1b2338 32.5% 34%,transparent 34% 66%,#1b2338 66% 67.5%,transparent 67.5%);opacity:.9}

.dw-id .rank-ins{width:36px;height:36px}.dw-id div{display:flex;flex-direction:column;line-height:1.1}.dw-id small{font:700 9px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}.dw-id b{font:800 20px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.deck-board{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:14px;overflow:hidden;background:rgba(94,230,255,.18);border:1px solid rgba(94,230,255,.3)}
.db-row{display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:#070c1c}.db-row small{font:700 9px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.db-row b{font:700 17px var(--disp);color:#9ff0ff;text-shadow:0 0 10px rgba(94,230,255,.45)}

.rack-slot{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:4px}.rack-rod{width:2px;height:10px;background:#56627f}.rack-thumb{width:26px;height:78px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}.rack-slot small{font:600 10px var(--body);color:var(--dim);text-align:center}.rack-slot.flying small{color:var(--gold)}

.deck-trophies{display:flex;gap:8px;flex-wrap:wrap}.trophy{flex:0 0 82px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:12px;background:linear-gradient(160deg,rgba(80,52,10,.55),rgba(18,16,30,.9));border:1px solid rgba(255,200,87,.45)}
.trophy b{font:800 18px var(--disp);color:var(--gold);text-shadow:0 0 12px rgba(255,200,87,.5)}.trophy small{font:600 9.5px/1.2 var(--body);color:#ffd99a;text-align:center}.trophy.empty{opacity:.35;filter:grayscale(1)}

/* Command Deck (3D): the hangar body becomes a touch layer over the room. */
#hangar[data-tab="deck"] .hg-body,#hangar[data-tab="control"] .hg-body,#hangar[data-tab="gunner"] .hg-body,#hangar[data-tab="hall"] .hg-body,#hangar[data-tab="comms"] .hg-body,#hangar[data-tab="quarters"] .hg-body,#hangar[data-tab="observatory"] .hg-body,#hangar[data-tab="yard"] .hg-body,#hangar[data-tab="beacons"] .hg-body,#hangar[data-tab="garden"] .hg-body,#hangar[data-tab="ops"] .hg-body{background:none;backdrop-filter:none;overflow:hidden}
.deck3d{position:relative;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.d3-top{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.d3-title{display:flex;flex-direction:column;line-height:1.1;padding:7px 12px;border-radius:12px;background:rgba(6,10,24,.74);border:1px solid rgba(94,230,255,.25);backdrop-filter:blur(4px)}
.d3-title small{font:700 9px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}.d3-title b{font:800 16px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.d3-exit{pointer-events:auto;display:inline-flex;align-items:center;gap:4px;background:rgba(6,10,24,.78);backdrop-filter:blur(4px)}
#hangar[data-tab="deck"] .hg-top,#hangar[data-tab="control"] .hg-top,#hangar[data-tab="hall"] .hg-top,#hangar[data-tab="comms"] .hg-top,#hangar[data-tab="quarters"] .hg-top,#hangar[data-tab="observatory"] .hg-top,#hangar[data-tab="yard"] .hg-top,#hangar[data-tab="beacons"] .hg-top,#hangar[data-tab="garden"] .hg-top,#hangar[data-tab="ops"] .hg-top{background:linear-gradient(180deg,rgba(3,5,18,.92),rgba(3,5,18,.62) 75%,rgba(3,5,18,.5))}
.deck3d:not(.gunner)::before{content:'';position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(180deg,rgba(3,5,18,.5),rgba(3,5,18,0));pointer-events:none}.deck3d.watching::before{display:none}
.d3-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:99px;background:rgba(6,10,24,.72);border:1px solid rgba(94,230,255,.3);font:600 12px var(--body);color:#cfeaff;text-align:center;pointer-events:none;transition:opacity .6s}
.d3-hint.off{opacity:0}
.deck3d.watching{cursor:default}
.deck3d.gunner{cursor:crosshair}.deck3d.gunner .d3-title{border-color:rgba(255,181,71,.35)}.deck3d.gunner .d3-title small{color:#ffb547}
.gn-hud{position:absolute;left:12px;right:12px;top:74px;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:12px;background:rgba(6,10,24,.66);border:1px solid rgba(94,230,255,.22);pointer-events:none;font:600 12px var(--body);color:#cfeaff}
.gn-hud small{font:700 9px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.gn-hud b{font:800 14px var(--disp);color:#9ff0ff;min-width:40px}.gn-hud span{margin-left:auto;color:var(--dim)}
.gn-hull{position:relative;flex:1;height:8px;border-radius:4px;background:#1a2440;overflow:hidden}.gn-hull i{position:absolute;inset:0 auto 0 0;background:#6dffc8;transition:width .25s}.gn-hull i.low{background:#ff5d6a}.gn-hull em{position:absolute;left:0;bottom:0;height:3px;background:#5ee6ff;transition:width .25s}
.gn-msl{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:104px;padding:10px 12px;border-radius:16px;background:rgba(6,10,24,.74);border:2px solid rgba(255,210,122,.45);color:#ffd27a;backdrop-filter:blur(4px)}
.gn-msl small{font:700 9px var(--cond);letter-spacing:.2em;text-transform:uppercase;opacity:.8}.gn-msl b{font:800 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.gn-msl.seeking{border-color:#ffd27a;animation:gnseek .35s infinite alternate}.gn-msl.locked{border-color:#ff4d6a;color:#ff8a9a;background:rgba(60,8,20,.8);box-shadow:0 0 18px rgba(255,77,106,.5)}.gn-msl.empty{opacity:.6}@keyframes gnseek{to{box-shadow:0 0 12px rgba(255,210,122,.5)}}
.gn-ammo{display:flex;gap:4px}.gn-ammo i{width:8px;height:14px;border-radius:3px;background:rgba(255,255,255,.14)}.gn-ammo i.on{background:currentColor}
.gn-reload{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}.gn-reload i{display:block;height:100%;background:currentColor}
.gn-pick{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:12px;padding:16px;background:rgba(2,4,14,.72);backdrop-filter:blur(3px)}.gn-pick.on{display:flex}
.gn-pick-head{display:flex;flex-direction:column;align-items:center;gap:2px}.gn-pick-head small{font:700 10px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:#6dffc8}.gn-pick-head b{font:800 22px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.gn-pick .reroll{align-self:center}
.deck3d.watching .d3-top,.deck3d.watching .d3-hint{display:none}
.rp-watch{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}.rp-watch>*{pointer-events:auto}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px 0}
.rp-title{display:flex;flex-direction:column;line-height:1.15;padding:7px 12px;border-radius:12px;background:rgba(6,10,24,.7);border:1px solid rgba(255,138,154,.35);backdrop-filter:blur(4px)}
.rp-title small{display:flex;align-items:center;gap:6px;font:700 9px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:#ff8a9a}.rp-title b{font:800 15px var(--disp);letter-spacing:.06em;color:var(--ink)}.rp-title span{font:600 11px var(--body);color:var(--dim)}
.rp-dot{width:7px;height:7px;border-radius:50%;background:#ff4d6a;animation:rpblink 1.2s infinite}@keyframes rpblink{50%{opacity:.2}}
.rp-close{background:rgba(6,10,24,.7)}
.rp-stats{align-self:flex-start;display:flex;align-items:center;gap:10px;margin:6px 12px 0;padding:6px 10px;border-radius:10px;background:rgba(6,10,24,.6);font:600 13px var(--body);color:#cfeaff}.rp-stats b{font:800 14px var(--disp);color:#9ff0ff}
.rp-hull{display:block;width:64px;height:6px;border-radius:3px;background:#1a2440;overflow:hidden}.rp-hull i{display:block;height:100%;background:#6dffc8;transition:width .2s}.rp-hull i.low{background:#ff5d6a}
.rp-end{display:none;align-self:center;margin:auto 0;flex-direction:column;align-items:center;gap:8px;padding:16px 22px;border-radius:16px;background:rgba(6,10,24,.84);border:1px solid rgba(109,255,200,.35)}.rp-end.on{display:flex}
.rp-end b{font:800 24px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#6dffc8}.rp-end.lost{border-color:rgba(255,138,154,.4)}.rp-end.lost b{color:#ff8a9a}.rp-end small{font:600 13px var(--body);color:var(--dim)}
.rp-bar{margin:auto 10px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(6,10,24,.78);border:1px solid rgba(94,230,255,.25);backdrop-filter:blur(4px)}
.rp-end.on+.rp-bar{margin-top:0}
.rp-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#e8f1ff}.rp-speed{width:46px;font:800 13px var(--disp)}
.rp-scrub{flex:1;min-width:40px;accent-color:#ff8a9a}.rp-time{flex:none;font:600 11px var(--body);color:var(--dim);white-space:nowrap}
.info-panel>*{flex-shrink:0}
.info-panel .deck-board,.info-panel .deck-wall,.info-panel .deck-rack,.info-panel .deck-bay,.info-panel .deck-trophies,.info-panel .oh-plan{margin-top:6px}
.d3-more{display:inline-flex;align-items:center;gap:4px;margin-top:10px}
.bay-stand.locked{opacity:.45;filter:grayscale(1)}

/* Tap the station in the sky (launch screen) to board the Command Deck. */
.station-hot{position:absolute;left:52%;top:8.5%;width:43%;height:13.5%;display:none;background:none;border:0;padding:0;cursor:pointer;z-index:1}
.station-hot.on{display:block}

/* The opening cinematic. */
#app.intro-on #hangar,#app.intro-on #hud,#app.intro-on #comms{visibility:hidden}
#intro{position:absolute;inset:0;z-index:90;display:none;overflow:hidden;cursor:default}#intro.on{display:block}
.in-bar{position:absolute;left:0;right:0;height:11%;background:#000;animation:inBarTop .9s cubic-bezier(.2,.7,.2,1) both}.in-bar.top{top:0}.in-bar.bottom{bottom:0;animation-name:inBarBottom}
@keyframes inBarTop{from{transform:translateY(-100%)}}@keyframes inBarBottom{from{transform:translateY(100%)}}
.in-cap{position:absolute;left:6%;right:6%;bottom:14%;padding:10px 14px;border-radius:14px;text-align:center;font:600 19px/1.35 var(--body);color:#e8f1ff;text-shadow:0 2px 12px #000,0 0 2px #000;letter-spacing:.02em;background:radial-gradient(80% 120% at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,0));opacity:0;transition:opacity .5s}.in-cap.on{opacity:1}
.in-title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20%;gap:8px;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45))}
#intro.titled .in-title{display:flex}#intro.titled{cursor:pointer}#intro.titled .in-cap{display:none}
.in-title b{font:700 32px var(--disp);letter-spacing:.3em;margin-right:-.3em;color:#e8f1ff;text-shadow:0 0 30px rgba(94,230,255,.6)}.in-title small{font:700 10px var(--cond);letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:var(--cyan)}
.in-title span{position:absolute;left:0;right:0;bottom:17%;text-align:center;font:700 13px var(--cond);letter-spacing:.34em;text-transform:uppercase;color:#e8f1ff;text-shadow:0 0 12px rgba(94,230,255,.8),0 2px 8px #000;animation:inPulse 1.6s ease-in-out infinite}
@keyframes inPulse{50%{opacity:.35}}
.in-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.in-flash.go{animation:inFlash 1.3s ease-out}
@keyframes inFlash{0%{opacity:0}6%{opacity:1}30%{opacity:.85}100%{opacity:0}}
.in-fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}.in-fade.on{opacity:1}
/* The rebuild reel names the piece at the top: system number, name, then the station's progress once it lights. */
.in-sys{position:absolute;left:0;right:0;top:max(calc(11% + 18px),calc(var(--st) + 76px));display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;opacity:0;transform:translateY(-6px);transition:opacity .8s,transform .8s;pointer-events:none}
.in-sys.on{opacity:1;transform:none}.in-sys:empty,.in-sys b:empty{display:none}
.in-sys small{font:700 10px var(--cond);letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px rgba(94,230,255,.6),0 1px 6px #000}
.in-sys b{font:700 24px var(--disp);letter-spacing:.22em;margin-right:-.22em;text-transform:uppercase;color:#e8f1ff;text-shadow:0 0 22px rgba(94,230,255,.55),0 2px 10px #000}
.in-sys span{font:600 12px var(--body);color:#cfe8ff;letter-spacing:.06em;text-shadow:0 1px 8px #000;opacity:0;transition:opacity .8s .6s}.in-sys.done span{opacity:1}
.in-skip{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));top:calc(max(var(--st),20px) + 22px);padding:8px 14px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#cfd8ea;font:700 11px var(--cond);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#intro.titled .in-skip{display:none}
/* The station AI's comms panel. */
#comms{position:absolute;left:12px;right:12px;top:calc(var(--st) + 78px);z-index:40;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(6,12,30,.92);border:1px solid rgba(94,230,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 20px rgba(94,230,255,.12);transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
#comms.on{opacity:1;transform:none;pointer-events:auto}
.cm-av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#9ff0ff,#1a6c8f 60%,#08203a);box-shadow:0 0 14px rgba(94,230,255,.5)}.cm-av i{width:13px;height:13px;border-radius:50%;background:#e8fbff;box-shadow:0 0 10px #5ee6ff;animation:inPulse 1.2s ease-in-out infinite}
.cm-main{min-width:0}.cm-who{font:700 9px var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}.cm-text{font:600 14px/1.35 var(--body);color:var(--ink);margin-top:2px;min-height:19px}
#app[data-mode="sortie"] #comms{display:none}
/* in a room aboard, ORBIT speaks from the bottom, clear of the room's title and Exit */
#app[data-room] #comms{top:auto;bottom:calc(var(--sb) + 92px)}

/* The station callout on the launch screen: text on the left, a hairline to the station's hub. */
.st-callout{position:absolute;left:14px;top:12%;z-index:2;display:none;flex-direction:column;align-items:flex-start;gap:1px;max-width:46%;padding:4px 10px 5px 0;background:none;border:0;border-left:2px solid rgba(94,230,255,.55);padding-left:9px;text-align:left;cursor:pointer;line-height:1.1}
.st-callout.on{display:flex}
.st-callout small{font:700 8.5px var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);opacity:.85}
.st-callout b{font:700 17px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:#e8f1ff;text-shadow:0 0 14px rgba(94,230,255,.45),0 1px 6px rgba(0,0,0,.8);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-callout.unnamed b{color:#a9b6d4;font-style:italic;letter-spacing:.1em}
.st-callout span{font:600 10.5px var(--body);color:#b8c6e4;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.co-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none}.co-svg.on{display:block}
.co-svg line{stroke:rgba(94,230,255,.5);stroke-width:1;stroke-dasharray:3 3}.co-svg circle{fill:none;stroke:#5ee6ff;stroke-width:1.5;filter:drop-shadow(0 0 3px #5ee6ff)}
.sc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.sc-actions .btn{flex:1 1 40%}
/* Buy buttons that cannot be pressed read as dark, whatever their colour when they can; a locked one shows a lock and why. */
.buy:disabled{color:var(--dim)}
.buy.bp:disabled,.buy.tech:disabled{background:rgba(255,255,255,.05);box-shadow:none}
.buy.bp:disabled{color:#e2b88f;border:1px solid rgba(255,159,67,.3)}.buy.tech:disabled{color:#9fdcf0;border:1px solid rgba(94,230,255,.28)}
.buy.locked:disabled{gap:5px;font:700 10.5px var(--cond);letter-spacing:.12em;text-transform:uppercase;color:#c9d2ea;background:rgba(255,255,255,.03);border:1px dashed rgba(201,210,234,.32)}
.buy.locked .ui-icon{width:14px;height:14px;opacity:.85}.buy.locked .ui-icon svg{width:100%;height:100%}
.row.maxed .buy.bp,.row.maxed .buy.tech{background:none;color:var(--green);border:1px solid rgba(109,255,200,.3)}
/* Station news: a toast when a buy changes the station, and the callout's figure glowing while it counts up. */
.toast.station{border-color:rgba(94,230,255,.55)}
.st-callout span{transition:color .3s,text-shadow .3s}.st-callout.up span{color:#aef4ff;text-shadow:0 0 10px rgba(94,230,255,.85),0 1px 6px #000}
.st-callout.news span{color:#ffd98a;text-shadow:0 0 10px rgba(255,200,87,.75),0 1px 6px #000;animation:scNew 1.6s ease-in-out infinite}
.co-new{display:none;margin-left:7px;padding:1px 5px 0;border-radius:4px;background:var(--gold);color:#1a1300;font:800 8px var(--disp);font-style:normal;letter-spacing:.08em;vertical-align:1px;animation:scNew 1.6s ease-in-out infinite}.st-callout.news .co-new{display:inline-block}
.oh-plan .sb-alien{stroke:#c9a0ff;fill:rgba(193,140,255,.2)}.oh-plan .sb-strut{stroke:rgba(193,140,255,.55);stroke-width:.16}
/* The rebuild bar in the station callout: skewed segments, one per 5%, grouped by part in the station's blues and violets. */
